<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to Form Editor</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; gap: 20px; padding: 20px; }
        .panel { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        textarea { height: 300px; font-family: monospace; padding: 10px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 10px; }
        label { font-weight: bold; margin-bottom: 5px; text-transform: capitalize; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: red; font-size: 0.9em; display: none; }
    </style>
</head>
<body>

    <!-- Left side: JSON Input -->
    <div class="panel">
        <h2>JSON Input</h2>
        <span id="errorMessage" class="error">Invalid JSON syntax!</span>
        <textarea id="jsonInput">
            {
            "name": "John Doe",
            "role": "Developer",
            "age": 30,
            "city": "Makkah"
            }
        </textarea>
    </div>

    <!-- Right side: Dynamic Form -->
    <div class="panel">
        <h2>Dynamic Editor</h2>
        <div id="formContainer"></div>
    </div>

    <script>
        const jsonInput = document.getElementById('jsonInput');
        const formContainer = document.getElementById('formContainer');
        const errorMessage = document.getElementById('errorMessage');
        
        let currentData = {};

        // 1. Read JSON and build the form
        function renderForm() {
            try {
                // Parse the JSON string into a JavaScript Object
                currentData = JSON.parse(jsonInput.value);
                errorMessage.style.display = 'none'; // Hide error if successful
                
                // Clear the form container
                formContainer.innerHTML = '';

                // Loop through keys and create input fields
                for (const [key, value] of Object.entries(currentData)) {
                    createInputField(key, value);
                }
            } catch (e) {
                // Show error if user types invalid JSON
                errorMessage.style.display = 'block';
            }
        }

        // 2. Create individual input fields and attach event listeners
        function createInputField(key, value) {
            const div = document.createElement('div');
            div.className = 'form-group';

            const label = document.createElement('label');
            label.textContent = key;

            const input = document.createElement('input');
            input.type = typeof value === 'number' ? 'number' : 'text';
            input.value = value;

            // 3. Listen for typing in the generated input fields
            input.addEventListener('input', (e) => {
                // Update the object with the new value
                // Convert back to number if the original was a number
                let newValue = e.target.value;
                if (input.type === 'number') {
                    newValue = Number(newValue);
                }

                currentData[key] = newValue;
                
                // Stringify the updated object and put it back in the textarea
                jsonInput.value = JSON.stringify(currentData, null, 2);
            });

            div.appendChild(label);
            div.appendChild(input);
            formContainer.appendChild(div);
        }

        // 4. Listen for manual typing in the JSON textarea
        jsonInput.addEventListener('input', renderForm);

        // Initial render on page load
        renderForm();
    </script>
</body>
</html>
